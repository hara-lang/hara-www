name: Apply benchmark publication boundary

on:
  push:
    branches: [agent/proxy-independent-benchmarks]
    paths:
      - .github/workflows/apply-benchmark-publication-boundary.yml
      - scripts/apply-benchmark-publication-boundary.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proxy-independent-benchmarks
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the publication split
        run: python scripts/apply-benchmark-publication-boundary.py
      - name: Validate generated sources
        run: |
          set -euo pipefail
          python -m json.tool package.json >/dev/null
          python -m json.tool src/data/benchmark-homepage.json >/dev/null
          node --check scripts/prepare-benchmark-homepage.mjs
          bash -n scripts/hara-assembly/build-www
          git diff --check
      - name: Commit the generated boundary
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Proxy independently published benchmarks"
          git push origin HEAD:agent/proxy-independent-benchmarks
