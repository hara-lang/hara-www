name: Provision docs.hara-lang.org DNS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs-dns.yml
      - scripts/configure-docs-dns.mjs
      - scripts/verify-docs-origin.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-hara-lang-org-dns
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.HARA_NETLIFY_AUTH_TOKEN }}
      NETLIFY_ACCOUNT_SLUG: zcaudate
      NETLIFY_DNS_ZONE: hara-lang.org
      DOCS_HOSTNAME: docs.hara-lang.org
      DOCS_TARGET: hara-lang.github.io
      DOCS_DNS_TTL: "300"
      DOCS_VERIFY_ATTEMPTS: "120"
      DOCS_VERIFY_INTERVAL_MS: "5000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test DNS provisioning logic
        run: node --test test/docs-dns.test.mjs

      - name: Provision GitHub Pages CNAME through Netlify DNS
        run: node scripts/configure-docs-dns.mjs

      - name: Verify public DNS and independent docs origin
        run: node scripts/verify-docs-origin.mjs
