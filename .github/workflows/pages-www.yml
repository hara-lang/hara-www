name: Deploy hara-lang.org
on:
  push:
    branches: [main, testing]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: netlify-www-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      HARA_WORKSPACE_ROOT: ${{ github.workspace }}/.workspace
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      # Keep the production assembler on the last complete Hara runtime tree
      # while the source/runtime repository split gets a native website build.
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 83f8a43767b98c85ff8a1dc2b127403a35807cee
          path: .workspace/technology/hara
      - uses: actions/checkout@v4
        with: {repository: hara-lang/hara-specs-registry, path: .workspace/technology/hara-specs-registry}
      - uses: actions/checkout@v4
        with: {repository: hara-lang/hara-extensions, path: .workspace/extensions}
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-ui
          ref: main
          path: .workspace/technology/hara-ui
      - name: Expose shared UI package for npm file dependencies
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../technology"
          ln -sfn "$GITHUB_WORKSPACE/.workspace/technology/hara-ui" "$GITHUB_WORKSPACE/../../technology/hara-ui"
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install site dependencies
        run: npm ci
      - name: Build and assemble site
        env:
          HARA_GITHUB_OAUTH_CLIENT_ID: ${{ vars.HARA_IDENTITY_GITHUB_OAUTH_CLIENT_ID }}
        run: scripts/hara-assembly/build-www
      - name: Test assembled site
        run: npm test
      - name: Deploy testing
        if: github.ref_name == 'testing'
        run: npx --yes netlify-cli deploy --prod --dir .workspace/technology/hara/core/target/www --message "testing ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.HARA_NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Verify testing
        if: github.ref_name == 'testing'
        run: |
          bash .github/scripts/verify-benchmark-observatory.sh https://testing.hara-lang.org/benchmarks/
          bash .github/scripts/verify-docs-navigation.sh https://testing.hara-lang.org
      - name: Deploy main
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --prod --dir .workspace/technology/hara/core/target/www --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.HARA_NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Verify production
        if: github.ref_name == 'main'
        run: |
          bash .github/scripts/verify-benchmark-observatory.sh https://hara-lang.org/benchmarks/
          bash .github/scripts/verify-docs-navigation.sh https://hara-lang.org
