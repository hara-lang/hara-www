name: Refresh www lockfile
on:
  push:
    branches: [agent/remove-embedded-docs-renderer-v2]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/visual-language
          ref: c49ad17d5052c8eeca0aff4a6146ff60b89ce88f
          path: packages/visual-language
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh package lock after docs cleanup"
            git push
          fi
